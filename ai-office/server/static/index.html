<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Office</title>
<style>
  body { margin: 0; font-family: sans-serif; background: #1e2430; color: #eee; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  form { display: flex; gap: 8px; margin-bottom: 12px; }
  input { flex: 1; padding: 10px; border-radius: 6px; border: 0; font-size: 16px; }
  button { padding: 10px 16px; border-radius: 6px; border: 0; background: #4a90e2; color: #fff; font-size: 16px; }
  canvas { width: 100%; background: #2b3344; border-radius: 8px; display: block; }
  ul { padding-left: 20px; }
  #status { color: #9ab; margin: 8px 0; }
</style>
</head>
<body>
<main>
  <h1>AI Office</h1>
  <form id="form">
    <input id="prompt" placeholder="例: ランディングページを作る" required maxlength="2000">
    <button>開始</button>
  </form>
  <canvas id="c" width="720" height="360"></canvas>
  <div id="status"></div>
  <ul id="tasks"></ul>
</main>
<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const W = canvas.width, H = canvas.height;
const ROOM = { x: 440, y: 40, w: 250, h: 280 };
const DESKS = { CEO: { x: 120, y: 90 }, Designer: { x: 120, y: 190 }, Engineer: { x: 120, y: 290 } };
const SEATS = { CEO: { x: 520, y: 140 }, Designer: { x: 610, y: 140 }, Engineer: { x: 565, y: 230 } };
const COLORS = { CEO: "#e2b34a", Designer: "#e25a8a", Engineer: "#4ac28a" };
const LABEL = { Idle: "待機中", Meeting: "会議中", Working: "作業中" };
const chars = {};
let agents = [];
let tick = 0;

function targetFor(a) {
  if (a.target === "MeetingRoom") return SEATS[a.id] || { x: 565, y: 180 };
  const d = DESKS[a.id] || { x: 120, y: 190 };
  return { x: d.x + 70, y: d.y };
}

async function poll() {
  try {
    const res = await fetch("/state");
    agents = (await res.json()).agents;
    const p = agents.find(a => a.project);
    document.getElementById("status").textContent =
      (p ? "プロジェクト: " + p.project + " / " : "") + agents.map(a => `${a.name}:${LABEL[a.state] || a.state}`).join("  ");
  } catch (e) {
    document.getElementById("status").textContent = "サーバーに接続できません";
  }
}

function roundRect(x, y, w, h, r, fill) {
  ctx.fillStyle = fill; ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill();
}

function drawBackground() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "#2b3344"; ctx.fillRect(0, 0, W, H);
  ctx.font = "13px sans-serif"; ctx.textAlign = "left";
  roundRect(ROOM.x, ROOM.y, ROOM.w, ROOM.h, 12, "#394560");
  roundRect(ROOM.x + 60, ROOM.y + 90, 130, 70, 35, "#5b4a3a");
  ctx.fillStyle = "#cfd6e6"; ctx.fillText("会議室", ROOM.x + 12, ROOM.y + 22);
  ctx.fillText("オフィス", 20, 22);
  for (const id in DESKS) {
    const d = DESKS[id];
    roundRect(d.x - 20, d.y - 22, 90, 44, 6, "#6a5a48");
    roundRect(d.x + 8, d.y - 18, 34, 22, 3, "#222a38");
    ctx.fillStyle = "#cfd6e6"; ctx.textAlign = "left";
    ctx.fillText(id, d.x - 20, d.y - 28);
  }
}

function drawAgent(a, c, moving) {
  const bob = moving ? Math.sin(tick / 4) * 2 : 0;
  ctx.fillStyle = "rgba(0,0,0,.25)";
  ctx.beginPath(); ctx.ellipse(c.x, c.y + 18, 13, 5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = COLORS[a.id] || "#ccc";
  ctx.beginPath(); ctx.arc(c.x, c.y + bob, 15, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#222";
  ctx.beginPath(); ctx.arc(c.x - 5, c.y - 3 + bob, 2, 0, 7); ctx.arc(c.x + 5, c.y - 3 + bob, 2, 0, 7); ctx.fill();
  ctx.textAlign = "center"; ctx.font = "12px sans-serif";
  ctx.fillStyle = "#fff"; ctx.fillText(a.name, c.x, c.y + 36);
  if (!moving && a.state !== "Idle") {
    const text = a.state === "Working" ? "⌨ カタカタ…" : "💬 …";
    const w = ctx.measureText(text).width + 14;
    roundRect(c.x - w / 2, c.y - 46, w, 20, 8, "#fff");
    ctx.fillStyle = "#222"; ctx.fillText(text, c.x, c.y - 32);
  }
}

function frame() {
  tick++;
  drawBackground();
  for (const a of agents) {
    const t = targetFor(a);
    const c = chars[a.id] || (chars[a.id] = { x: t.x, y: t.y });
    const dx = t.x - c.x, dy = t.y - c.y, dist = Math.hypot(dx, dy);
    const moving = dist > 2;
    if (moving) { const step = Math.min(1.6, dist); c.x += dx / dist * step; c.y += dy / dist * step; }
    drawAgent(a, c, moving);
  }
  requestAnimationFrame(frame);
}

document.getElementById("form").addEventListener("submit", async e => {
  e.preventDefault();
  const prompt = document.getElementById("prompt").value;
  const res = await fetch("/start_project", {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ prompt })
  });
  const data = await res.json();
  document.getElementById("tasks").innerHTML = (data.tasks || []).map(t => "<li></li>").join("");
  [...document.querySelectorAll("#tasks li")].forEach((li, i) => li.textContent = data.tasks[i]);
  poll();
});

setInterval(poll, 1000);
poll();
frame();
</script>
</body>
</html>
